<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Rental Details | Gajra Avenue</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
    --gold: #c5a059;
    --gold-light: #e2c275;
    --obsidian: #0a0a0b;
    --white: #ffffff;
}

/* BODY */
body {
    margin:0;
    padding: 80px 0;

    font-family: 'Montserrat', sans-serif;

    background: linear-gradient(rgba(10,10,11,0.85), rgba(10,10,11,0.95)),
    url('gajra.jpg');

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    color: var(--white);
}

/* BRAND */
.brand{
    margin-top: 60px;
    text-align:center;
}

.brand h1{
    font-family: 'Cinzel', serif;
    color: var(--gold);
    letter-spacing: 6px;
    font-weight: 700;
    font-size: 40px;
}

/* FORM BOX */
.form-box{
    max-width: 750px;
    width: 100%;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(18px);

    padding: 60px 40px 100px;

    border-radius: 2px;
    border: 1px solid rgba(197,160,89,0.2);
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);

    margin: 40px 0;

    animation: fadeUp 0.8s ease;
}

@keyframes fadeUp {
    from {opacity:0; transform:translateY(30px);}
    to {opacity:1; transform:translateY(0);}
}

/* TITLE */
.form-title{
    font-family:'Cinzel',serif;
    color: white;
    text-align:center;
    margin-bottom:5px;
    letter-spacing:2px;
}

/* TAGLINE */
.tagline{
    text-align:center;
    font-size:13px;
    letter-spacing:2px;
    color: rgba(255,255,255,0.6);
    margin-bottom:30px;
}

/* SECTION HEADINGS */
.section-title{
    color: white;
    font-weight: 600;
}

/* LABELS */
label{
    margin-top:10px;
    font-weight:500;
    font-size:13px;
    color: var(--gold);
    letter-spacing:1px;
    text-transform: uppercase;
}

/* INPUT */
.form-control{
    background: rgba(255,255,255,0.05);
    color:white;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:0;
    padding:12px;
}

.form-control::placeholder{
    color: rgba(255,255,255,0.4);
}

.form-control:focus{
    background: rgba(255,255,255,0.08);
    border-color: var(--gold);
    box-shadow: 0 0 15px rgba(197,160,89,0.2);
    color:white;
}

/* BUTTON */
.btn-gold{
    background: var(--gold);
    color:#000;
    padding:14px;
    width:100%;
    border:none;
    margin-top:20px;
    font-weight:700;
    letter-spacing:2px;
}

.btn-gold:hover{
    background:white;
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(197,160,89,0.3);
}

/* FILE BOX (CENTERED) */
.file-box{
    border:2px dashed var(--gold-light);
    padding:30px;
    text-align:center;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;

    display:block;
    margin: 0 auto;
    max-width: 100%;
}

.file-box.dragover{
    background:rgba(197,160,89,0.15);
    border-color: var(--gold);
}

/* PREVIEW */
.preview-container{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:15px;
}

.preview{
    position:relative;
    overflow:hidden;
    border-radius:8px;
}

/* IMAGE HOVER */
.preview img{
    width:130px;
    height:95px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--gold);
    transition:0.3s;
}

.preview:hover img{
    transform: scale(1.08);
    box-shadow:0 0 15px rgba(197,160,89,0.5);
}

/* REMOVE BUTTON */
.remove-btn{
    position:absolute;
    top:4px;
    right:6px;
    background:red;
    color:white;
    border:none;
    border-radius:50%;
    width:22px;
    height:22px;
    font-size:13px;
    cursor:pointer;
}

/* SUCCESS */
.success-msg{
    display:none;
    text-align:center;
    color:#00ffae;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="brand">
    <h1>GAJRA AVENUE</h1>
</div>

<div class="form-box">

<h2 class="form-title">Add Rental Details</h2>
<p class="tagline">List Your Property With Architectural Elegance</p>

<form id="rentalForm">

<h5 class="section-title mb-3">Owner Information</h5>

<div class="mb-3">
<label>Owner Name</label>
<input type="text" class="form-control" placeholder="Enter owner name" required>
</div>

<div class="mb-3">
<label>Contact Number</label>
<input type="tel" class="form-control" placeholder="Enter contact number" required>
</div>

<div class="mb-3">
<label>Email Address</label>
<input type="email" class="form-control" placeholder="Enter email address" required>
</div>

<hr>

<h5 class="section-title mb-3">Flat Details</h5>

<div class="mb-3">
<label>Rent Amount (₹)</label>
<input type="number" class="form-control" placeholder="Enter rent amount" required>
</div>

<div class="mb-3">
<label>Flat Type</label>
<select class="form-control">
<option>1 RK</option>
<option>1 BHK</option>
<option>2 BHK</option>
<option>3 BHK</option>
</select>
</div>

<div class="mb-3">
<label>Description</label>
<textarea class="form-control" rows="3" placeholder="Enter flat description"></textarea>
</div>

<hr>

<h5 class="section-title mb-3">Upload Flat Photos</h5>

<label class="file-box" id="dropArea">
<p>📸 Click or Drag & Drop Images</p>
<small class="text-white-50">Upload multiple photos</small>
<input type="file" id="imageInput" multiple accept="image/*">
</label>

<div class="preview-container" id="previewContainer"></div>

<button type="submit" class="btn btn-gold">Save Rental Details</button>

<div class="success-msg" id="successMsg">
✔ Rental Details Saved Successfully!
</div>

</form>
</div>

<script>
const input = document.getElementById("imageInput");
const previewContainer = document.getElementById("previewContainer");
const dropArea = document.getElementById("dropArea");

input.addEventListener("change", handleFiles);

dropArea.addEventListener("dragover", e=>{
    e.preventDefault();
    dropArea.classList.add("dragover");
});

dropArea.addEventListener("dragleave", ()=>{
    dropArea.classList.remove("dragover");
});

dropArea.addEventListener("drop", e=>{
    e.preventDefault();
    dropArea.classList.remove("dragover");
    input.files = e.dataTransfer.files;
    handleFiles.call(input);
});

function handleFiles(){
    previewContainer.innerHTML = "";

    Array.from(this.files).forEach(file=>{
        const reader = new FileReader();

        reader.onload = function(e){
            const div = document.createElement("div");
            div.classList.add("preview");

            div.innerHTML = `
                <img src="${e.target.result}">
                <button class="remove-btn">×</button>
            `;

            div.querySelector(".remove-btn").onclick = () => div.remove();
            previewContainer.appendChild(div);
        }

        reader.readAsDataURL(file);
    });
}
</script>

</body>
</html>
