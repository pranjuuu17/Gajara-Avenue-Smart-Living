<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Visitor | Gajra Avenue</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
    --gold: #c5a059;
    --bg: #0a0a0b;
}

body{
    font-family:'Montserrat',sans-serif;
    background: var(--bg);
    color:white;
}

/* HEADER */
/* HEADER */
.service-header{
   height: 160px;              /* Fixed smaller height */ 
   display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(to right, rgba(10,10,11,0.85), rgba(10,10,11,0.6)),
        url('gajra_avenue-pathardi_phata-nashik-gajra_associates.jpg');
    background-size:cover;
    background-position:center;
    text-align:center;
    margin-bottom: 40px;
}

.service-header h1{
    font-family:'Cinzel',serif;
    font-size:52px;
    color:var(--gold);
    letter-spacing:2px;
}

@media screen and (max-width:700px) {
    .service-header {
        padding: 20px;
    }
    .service-header h1{
        font-size: 30px;
    }
}

/* FORM CARD */
.form-card{
    max-width:600px;
    margin:auto;
    background:#111;
    padding:30px;
    border-radius:15px;
    border:1px solid rgba(197,160,89,0.3);
    margin-bottom: 40px;
}

/* INPUTS */

.form-control, .form-select{
    background: #f8f9fa;   /* soft white */
    color: #000;
    border: 1px solid #ddd;
}
/* Placeholder color */
.form-control::placeholder{
    color: #888;
}

/* Focus state */
.form-control:focus, .form-select:focus{
    background: #fff;
    color: #000;
    border-color: var(--gold);
    box-shadow: 0 0 5px rgba(197,160,89,0.3);
}
/* BUTTON */
.btn-gold{
    background:var(--gold);
    color:black;
    font-weight:600;
    border:none;
}

.btn-gold:hover{
    background:white;
    color:black;
}

/* ICON LABEL */
.label-icon{
    color:var(--gold);
    margin-right:6px;
}
</style>
</head>

<body>

<!-- HEADER -->
 <section class="service-header">
    <h1>Pre-Approve Guests</h1>
    <p>Let security know who to expect</p>
</section>


<!-- FORM -->
<div class="form-card">

<form>

<!-- Guest Name -->
<div class="mb-3">
<label class="form-label">
<i class="fa fa-user label-icon"></i> Guest Name
</label>
<input type="text" class="form-control" placeholder="Enter guest name" required>
</div>

<!-- Mobile -->
<div class="mb-3">
<label class="form-label">
<i class="fa fa-phone label-icon"></i> Mobile Number
</label>
<input type="tel" class="form-control" placeholder="Enter mobile number">
</div>

<!-- Flat -->
<div class="mb-3">
<label class="form-label">
<i class="fa fa-building label-icon"></i> Flat Number
</label>
<input type="text" class="form-control" value="A-203" readonly>
</div>

<!-- Purpose -->
<div class="mb-3">
<label class="form-label">
<i class="fa fa-info-circle label-icon"></i> Purpose
</label>
<select class="form-select">
<option>Personal Visit</option>
<option>Delivery</option>
<option>Maintenance</option>
<option>Other</option>
</select>
</div>

<!-- Date -->
<div class="mb-3">
<label class="form-label">
<i class="fa fa-calendar label-icon"></i> Visit Date
</label>
<input type="date" class="form-control" required>
</div>

<!-- Time -->
<div class="mb-3">
<label class="form-label">
<i class="fa fa-clock label-icon"></i> Expected Time
</label>
<input type="time" class="form-control" required>
</div>

<!-- Notes -->
<div class="mb-3">
<label class="form-label">
<i class="fa fa-note-sticky label-icon"></i> Additional Notes
</label>
<textarea class="form-control" rows="2" placeholder="Optional notes"></textarea>
</div>

<!-- SUBMIT -->
<div class="text-center mt-4">
<button type="submit" class="btn btn-gold px-4 py-2">
<i class="fa fa-check me-2"></i> Add Visitor
</button>
</div>

</form>

</div>

</body>
</html>
