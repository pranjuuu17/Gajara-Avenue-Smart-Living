<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile | Gajra Avenue</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

:root{
--gold:#c5a059;
--obsidian:#0a0a0b;
--card:#111;
}

body{
background:var(--obsidian);
color:white;
font-family:'Montserrat';
}

.title{
font-family:'Cinzel';
color:var(--gold);
text-align:center;
margin:45px 0;
letter-spacing:2px;

}

.edit-card{
background:var(--card);
border:1px solid rgba(197,160,89,0.3);
padding:40px;
border-radius:12px;
box-shadow:0 20px 40px rgba(0,0,0,0.4);
transition:0.4s;
}

.edit-card:hover{
border-color:var(--gold);
}

.profile-img{
width:120px;
height:120px;
border-radius:50%;
border:4px solid var(--gold);
object-fit:cover;
display:block;
margin:auto;
margin-bottom:15px;
}

.form-control{
background:#181818;
border:1px solid #333;
color:white;
}

.form-control:focus{
border-color:var(--gold);
box-shadow:none;
background:#181818;
color:white;
}

.form-label{
color:#ccc;
}

.btn-gold{
background:var(--gold);
border:none;
color:black;
font-weight:600;
padding:10px 25px;
}

.btn-gold:hover{
background:white;
color: #0a0a0b;
}

.btn-cancel{
border:1px solid #777;
color:#ccc;
}

.btn-cancel:hover{
background:#222;
}

.upload-text{
font-size:14px;
color:#aaa;
text-align:center;
margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

<h1 class="title">Edit Profile </h1>
<P class="title" style="color: white;margin: 0px;font-family:sans-serif;font-weight: 200;">WATCHMAN ID:<SPAN class="title">WCH102</SPAN></P>
<div class="row justify-content-center">

<div class="col-md-6">

<div class="edit-card">

<img src="https://thumbs.dreamstime.com/b/guardian-radio-transmitter-cartoon-character-guardian-radio-transmitter-cartoon-character-bodyguard-flat-vector-142265240.jpg" class="profile-img">

<div class="upload-text">
Change Profile Picture

</div>

<form>

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" value="Ramesh Shinde">
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="text" class="form-control" value="+91 9876543210">
</div>

<div class="mb-3">
<label class="form-label">Shift Timing</label>
<select class="form-control">
<option>Morning (6 AM – 2 PM)</option>
<option>Afternoon (2 PM – 10 PM)</option>
<option>Night (10 PM – 6 AM)</option>
</select>
</div>



<div class="d-flex gap-3 mt-4">

<button class="btn btn-gold w-50">
Save Changes
</button>

<a href="profile.html" class="btn btn-cancel w-50">
Cancel
</a>

</div>

</form>

</div>

</div>

</div>

</div>

</body>
</html>
