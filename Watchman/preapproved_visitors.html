<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitors | Gajra Avenue</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
    --gold:#c5a059;
    --bg:#0a0a0b;
}
body{
    background:var(--bg);
    color:white;
    font-family:'Montserrat';
}

/* HEADER (SAME STYLE) */
.header{
   height: 160px;              /* Fixed smaller height */ 
   display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(to right, rgba(10,10,11,0.85), rgba(10,10,11,0.6)),
        url('gajra_avenue-pathardi_phata-nashik-gajra_associates.jpg');
    background-size:cover;
    background-position:center;
    text-align:center;
}

.header h1{
    font-family:'Cinzel',serif;
    color:var(--gold);
}

/* CARD */
.visitor-card{
    background:#111;
    border:1px solid rgba(197,160,89,0.4);
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.3s;
}

.visitor-card:hover{
    transform:translateX(6px);
    background:rgba(147, 121, 74, 0.13);
}

.badge-expected{
    background:#ffc107;
    color:black;
    padding:5px 12px;
    border-radius:20px;
    font-weight: 600;
}

.btn-visited{
    background-color:greenyellow;
    border:none;
    padding:6px 14px;
    font-weight: 800;
    color: black;
}

.btn-visited:hover{
    background:white;
    color: black;
}
</style>
</head>

<body>

<section class="header">
<h1>Society Updates</h1>
<p class="text-white-50">Latest announcements & activities</p>
</section>

<div class="container py-5">

<div class="visitor-card">
<div>
<h6>Priya Sharma</h6>
<small class="text-white-50">Flat A-203 • 5:30 PM • Personal</small>
</div>

<div class="d-flex gap-2 align-items-center">
<span class="badge-expected">Expected</span>
<button class="btn btn-visited btn-sm">Visited</button>
</div>
</div>

<div class="visitor-card">
<div>
<h6>Zomato Delivery</h6>
<small class="text-white-50">Flat B-101 • 1:15 PM • Delivery</small>
</div>

<div class="d-flex gap-2 align-items-center">
<span class="badge-expected">Expected</span>
<button class="btn btn-visited btn-sm">Visited</button>
</div>
</div>

</div>

</body>
</html>
